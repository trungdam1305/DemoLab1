<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trợ Lý CLI — Web UI</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --accent: #2f6fed;
    --accent-soft: #eaf1ff;
    --assistant-bubble: #f0f0f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-size: 1.25rem;
    margin: 0;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .persona-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
  }
  .persona-box label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .persona-box textarea {
    width: 100%;
    border: none;
    resize: none;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    background: transparent;
    outline: none;
    min-height: 40px;
  }
  .chat-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    flex: 1;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.assistant.pending::after {
    content: "▍";
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty-hint {
    margin: auto;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  form.composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  form.composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.92rem;
    outline: none;
    min-height: 42px;
    max-height: 120px;
  }
  form.composer textarea:focus { border-color: var(--accent); }
  button {
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.send {
    background: var(--accent);
    color: white;
  }
  button.send:disabled {
    background: #a9c2f5;
    cursor: not-allowed;
  }
  button.reset {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    padding: 6px 12px;
  }
  footer.stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: var(--muted);
    padding: 4px 4px;
  }
  footer.stats .values {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .error-banner {
    background: #fdeaea;
    color: #b3261e;
    border: 1px solid #f3c6c4;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
    display: none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🤖 Trợ Lý CLI — Web UI</h1>
      <p>Giao diện web cho streaming_chatbot / run_assistant (template.py)</p>
    </div>
    <button class="reset" id="resetBtn" type="button">Đặt lại phiên</button>
  </header>

  <div class="persona-box">
    <label for="persona">System prompt (persona) — áp dụng từ tin nhắn tiếp theo</label>
    <textarea id="persona" rows="2">{{ default_persona }}</textarea>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="empty-hint">Gõ tin nhắn bên dưới để bắt đầu trò chuyện.</div>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter xuống dòng)" rows="1"></textarea>
      <button class="send" id="sendBtn" type="submit">Gửi</button>
    </form>
  </div>

  <footer class="stats">
    <span>Lịch sử tối đa 3 lượt gần nhất (6 message)</span>
    <div class="values">
      <span>Lượt: <strong id="statTurns">0</strong></span>
      <span>Token: <strong id="statTokens">0</strong></span>
      <span>Chi phí: <strong id="statCost">$0.000000</strong></span>
    </div>
  </footer>
</div>

<script>
const messagesEl = document.getElementById("messages");
const composer = document.getElementById("composer");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const personaEl = document.getElementById("persona");
const resetBtn = document.getElementById("resetBtn");
const errorBanner = document.getElementById("errorBanner");

function clearEmptyHint() {
  const hint = messagesEl.querySelector(".empty-hint");
  if (hint) hint.remove();
}

function addBubble(role, text) {
  clearEmptyHint();
  const div = document.createElement("div");
  div.className = "bubble " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = "block";
}

function hideError() {
  errorBanner.style.display = "none";
}

async function refreshStats() {
  try {
    const res = await fetch("/api/stats");
    const data = await res.json();
    document.getElementById("statTurns").textContent = data.num_turns;
    document.getElementById("statTokens").textContent = data.total_tokens;
    document.getElementById("statCost").textContent = "$" + data.total_cost.toFixed(6);
  } catch (e) {
    // im lặng — không chặn UI vì lỗi thống kê
  }
}

async function sendMessage(text) {
  addBubble("user", text);
  const assistantBubble = addBubble("assistant", "");
  assistantBubble.classList.add("pending");

  sendBtn.disabled = true;
  hideError();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, persona: personaEl.value }),
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || ("Lỗi server: " + res.status));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let full = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      assistantBubble.textContent = full;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  } catch (err) {
    showError("Không gọi được API: " + err.message);
  } finally {
    assistantBubble.classList.remove("pending");
    sendBtn.disabled = false;
    refreshStats();
  }
}

composer.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendMessage(text);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    composer.requestSubmit();
  }
});

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

resetBtn.addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  messagesEl.innerHTML = '<div class="empty-hint">Gõ tin nhắn bên dưới để bắt đầu trò chuyện.</div>';
  hideError();
  refreshStats();
});

refreshStats();
</script>
</body>
</html>
